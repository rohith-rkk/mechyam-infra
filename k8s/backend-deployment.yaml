apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: devops-assignment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/mechyam/actuator/prometheus"
    spec:
      containers:
        - name: backend
          image: docrohith/backend-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/mechyamdb?createDatabaseIfNotExist=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "rootpassword"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            
           
            - name: MANAGEMENT_HEALTH_REDIS_ENABLED
              value: "false"

          
          readinessProbe:
            httpGet:
              path: /mechyam/actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /mechyam/actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5