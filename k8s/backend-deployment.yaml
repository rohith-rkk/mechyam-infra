apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: devops-assignment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/mechyam/actuator/prometheus"
    spec:
      containers:
        - name: backend
          image: docrohith/backend-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /mechyam/actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /mechyam/actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
