apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mechyam-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/rohith-rkk/mechyam-infra.git"
    targetRevision: main
    path: k8s
  destination:
    server: "https://kubernetes.default.svc"
    namespace: devops-assignment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

